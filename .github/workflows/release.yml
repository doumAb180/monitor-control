name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: Build app
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: VERSION="${RELEASE_TAG#v}" bash scripts/build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.dmg dist/*.zip dist/*.sha256 --verify-tag --generate-notes --title "Monitor $RELEASE_TAG" --prerelease
